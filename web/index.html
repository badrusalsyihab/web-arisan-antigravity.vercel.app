<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Digital Arisan Application">
  <meta name="google-signin-client_id" content="224225254785-j0r2s9s61khb18i11jje50rosdt0pe3q.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app_arisan_antigravity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=5"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=5"/>

  <title>Digital Arisan</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase JS SDK Compat for Flutter Web -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(108, 92, 231, 0.25);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      color: #1E293B;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: #64748B;
      margin-bottom: 24px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid #E2E8F0;
      border-top: 4px solid #6C5CE7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(108, 92, 231, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(108, 92, 231, 0); }
    }
  </style>
</head>
<body>
  <!-- Custom Splash Screen before Flutter loads -->
  <div id="flutter_splash" class="splash-container">
    <img src="favicon.png" alt="Digital Arisan" class="logo" />
    <div class="title">Digital Arisan</div>
    <div class="subtitle">Sedang memuat aplikasi...</div>
    <div class="loader"></div>
  </div>

  <script>
    // Hapus splash screen saat Flutter telah me-render frame pertamanya
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('flutter_splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.4s ease-out';
        setTimeout(function() {
          splash.style.display = 'none';
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=10" async></script>
</body>
</html>
